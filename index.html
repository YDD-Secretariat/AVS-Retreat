<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AVS Retreat 2026 — Home</title>
<style>
  :root{--bg:#0f172a;--card:#ffffff;--accent:#4f46e5;--muted:#64748b;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(160deg,#0f172a,#1e293b);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:24px;}
  .wrap{max-width:420px;width:100%;}
  h1{color:#fff;text-align:center;font-size:1.6rem;margin-bottom:4px;}
  p.sub{color:#94a3b8;text-align:center;margin-top:0;margin-bottom:28px;}
  .card{background:var(--card);border-radius:16px;padding:20px 22px;margin-bottom:14px;
    display:flex;align-items:center;gap:16px;text-decoration:none;box-shadow:0 8px 24px rgba(0,0,0,.25);
    transition:transform .15s ease;}
  .card:active{transform:scale(0.98);}
  .icon{font-size:1.8rem;}
  .title{font-weight:700;color:#0f172a;font-size:1.05rem;}
  .desc{color:var(--muted);font-size:0.85rem;margin-top:2px;}
</style>
</head>
<body>
  <div class="wrap">
    <h1>AVS Retreat 2026</h1>
    <p class="sub">October 1st · Anthony, Lagos</p>

    <a class="card" href="register.html">
      <div class="icon">📝</div>
      <div>
        <div class="title">Register a School</div>
        <div class="desc">For registration stations 1–5</div>
      </div>
    </a>

    <a class="card" href="member-register.html">
      <div class="icon">⛪</div>
      <div>
        <div class="title">Register Church Members</div>
        <div class="desc">Anthony Groups 1–4, Others · Members / Workers</div>
      </div>
    </a>

    <a class="card" href="upload.html">
      <div class="icon">📷</div>
      <div>
        <div class="title">Upload Attendance Sheets</div>
        <div class="desc">Photo uploader — pick a school, snap & upload</div>
      </div>
    </a>

    <a class="card" href="dashboard.html">
      <div class="icon">📊</div>
      <div>
        <div class="title">Live Dashboard</div>
        <div class="desc">Public / department view</div>
      </div>
    </a>
  </div>
</body>
</html>
