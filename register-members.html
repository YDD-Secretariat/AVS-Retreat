<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Register Members (Bulk) — AVS Retreat</title>
<style>
  :root{--accent:#0d9488;--bg:#f8fafc;--border:#e2e8f0;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:#0f172a;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
  header{position:sticky;top:0;background:var(--accent);color:#fff;padding:14px 16px;
    padding-top:calc(14px + env(safe-area-inset-top,0px));z-index:10;
    display:flex;justify-content:space-between;align-items:center;}
  header a{color:#fff;text-decoration:none;font-size:0.85rem;opacity:0.9;}
  header h1{font-size:1.05rem;margin:0;}
  .type-badge{display:inline-block;background:rgba(255,255,255,.2);color:#fff;font-size:0.68rem;
    font-weight:700;padding:2px 8px;border-radius:20px;margin-left:8px;letter-spacing:0.03em;}
  main{max-width:480px;margin:0 auto;padding:16px;padding-bottom:60px;}

  .hint{color:#64748b;font-size:0.85rem;margin:0 0 16px;}

  .station-bar{background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px 14px;
    margin-bottom:16px;display:flex;gap:8px;align-items:center;}
  .station-bar input{flex:1;border:none;font-size:0.95rem;background:transparent;outline:none;}
  .station-bar label{font-size:0.8rem;color:#64748b;white-space:nowrap;}

  .field{margin-bottom:18px;}
  .field > label{display:block;font-size:0.82rem;color:#475569;margin-bottom:8px;font-weight:600;}

  .chip-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .chip{border:1.5px solid var(--border);border-radius:10px;padding:14px 6px;text-align:center;
    font-weight:700;font-size:0.95rem;background:#fff;cursor:pointer;color:#475569;}
  .chip.active{border-color:var(--accent);background:#f0fdfa;color:var(--accent);}
  .chip.others{grid-column:span 3;}

  .count-field input{width:100%;padding:16px;border:1px solid var(--border);border-radius:10px;
    font-size:1.6rem;font-weight:800;text-align:center;background:#fff;}
  .count-field input:focus{outline:2px solid var(--accent);border-color:transparent;}

  .summary{background:#f0fdfa;border-radius:10px;padding:14px;font-size:1rem;color:#0f766e;
    margin-bottom:16px;font-weight:700;text-align:center;display:none;}

  button.submit{width:100%;padding:16px;border:none;border-radius:12px;background:var(--accent);
    color:#fff;font-size:1.1rem;font-weight:700;cursor:pointer;}
  button.submit:disabled{opacity:0.6;}

  .msg{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:0.9rem;display:none;}
  .msg.ok{background:#dcfce7;color:#166534;display:block;}
  .msg.err{background:#fee2e2;color:#991b1b;display:block;}

  .recent{margin-top:24px;}
  .recent h3{font-size:0.9rem;color:#475569;margin-bottom:8px;}
  .recent-item{background:#fff;border:1px solid var(--border);border-radius:10px;
    padding:10px 12px;margin-bottom:8px;font-size:0.85rem;display:flex;justify-content:space-between;}
  .recent-item .rname{font-weight:700;}
  .recent-item .rmeta{color:#64748b;font-size:0.78rem;}
</style>
</head>
<body>
<header>
  <h1>Register Members <span class="type-badge">BULK</span></h1>
  <a href="index.html">Home</a>
</header>
<main>
  <p class="hint">For headcounts taken on paper — no names needed. Pick a group, enter the total, and register.</p>

  <div class="station-bar">
    <label for="station">Desk:</label>
    <input id="station" placeholder="e.g. Church Desk – Tunde" />
  </div>

  <form id="bulkForm">
    <div class="field">
      <label>Group</label>
      <div class="chip-row" id="groupChips">
        <div class="chip" data-value="Group 1">Group 1</div>
        <div class="chip" data-value="Group 2">Group 2</div>
        <div class="chip" data-value="Group 3">Group 3</div>
        <div class="chip" data-value="Group 4">Group 4</div>
        <div class="chip others" data-value="Others">Others (outside Anthony)</div>
      </div>
    </div>

    <div class="field count-field">
      <label>Number of People</label>
      <input id="count" type="number" inputmode="numeric" min="1" placeholder="0" required autofocus />
    </div>

    <div class="summary" id="summary"></div>

    <button type="submit" class="submit" id="submitBtn">Register</button>
    <div class="msg" id="msg"></div>
  </form>

  <div class="recent">
    <h3>Recently registered</h3>
    <div id="recentList"><div class="recent-item"><span class="rmeta">Loading…</span></div></div>
  </div>
</main>

<script src="config.js"></script>
<script>
  const stationInput = document.getElementById('station');
  stationInput.value = AVS.getStation();
  stationInput.addEventListener('change', () => AVS.setStation(stationInput.value.trim()));

  let selectedGroup = null;
  const chips = [...document.getElementById('groupChips').querySelectorAll('.chip')];
  chips.forEach(chip => {
    chip.addEventListener('click', () => {
      chips.forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      selectedGroup = chip.dataset.value;
      updateSummary();
    });
  });

  const countInput = document.getElementById('count');
  countInput.addEventListener('input', updateSummary);

  const summary = document.getElementById('summary');
  function updateSummary() {
    const count = parseInt(countInput.value) || 0;
    if (selectedGroup && count > 0) {
      summary.style.display = 'block';
      summary.textContent = `Registering ${count} member${count === 1 ? '' : 's'} — ${selectedGroup}`;
    } else {
      summary.style.display = 'none';
    }
  }

  const form = document.getElementById('bulkForm');
  const submitBtn = document.getElementById('submitBtn');
  const msg = document.getElementById('msg');
  function showMsg(text, ok) {
    msg.textContent = text;
    msg.className = 'msg ' + (ok ? 'ok' : 'err');
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    msg.className = 'msg';
    if (!selectedGroup) return showMsg('❌ Please select a group.', false);
    const count = parseInt(countInput.value) || 0;
    if (count <= 0) return showMsg('❌ Enter how many people were registered.', false);

    submitBtn.disabled = true;
    submitBtn.textContent = 'Saving…';
    try {
      const res = await AVS.post({
        action: 'registerBulkMembers',
        group: selectedGroup,
        count: count,
        submittedBy: stationInput.value.trim(),
        station: stationInput.value.trim()
      });
      if (res.success) {
        showMsg(`✅ Saved — ${res.count} member(s) added to ${res.group}.`, true);
        countInput.value = '';
        summary.style.display = 'none';
        loadRecent();
      } else {
        showMsg('❌ ' + (res.error || 'Could not save this registration.'), false);
      }
    } catch (err) {
      showMsg('❌ Network error — check connection and try again.', false);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Register';
    }
  });

  async function loadRecent() {
    const list = document.getElementById('recentList');
    try {
      const res = await AVS.get('getRecentBulk', { limit: 8 });
      const items = res.recent || [];
      if (!items.length) {
        list.innerHTML = '<div class="recent-item"><span class="rmeta">No entries yet.</span></div>';
        return;
      }
      list.innerHTML = items.map(m => `
        <div class="recent-item">
          <div>
            <div class="rname">${m.Group} — ${m.Count} members</div>
            <div class="rmeta">${m.SubmittedBy || 'Desk —'}</div>
          </div>
          <div class="rmeta">${new Date(m.RegisteredAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div>
        </div>
      `).join('');
    } catch (e) {
      list.innerHTML = '<div class="recent-item"><span class="rmeta">Could not load recent activity.</span></div>';
    }
  }

  loadRecent();
  setInterval(loadRecent, 8000);
</script>
</body>
</html>
